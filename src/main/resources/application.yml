spring:
  application:
    name: coachly-feedback-be
  mvc:
    log-request-details: true
  threads:
    virtual:
      enabled: true
  datasource:
    driver-class-name: org.postgresql.Driver
    url: ${COACHLY_DB_URL}
    username: ${COACHLY_DB_USERNAME}
    password: ${COACHLY_DB_PASSWORD}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 20000
      idle-timeout: 300000
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        default_schema: feedback
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
  flyway:
    enabled: true
    default-schema: feedback
    schemas: feedback

server:
  address: 0.0.0.0
  port: ${SERVER_PORT:${PORT:8080}}
  compression:
    enabled: true
  http2:
    enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

app:
  security:
    user-id: X-User-Id
    user-role: X-User-Role
    correlation-id: X-Correlation-Id
  comments:
    max-depth: 4
    allowed-vote-types: [UP, DOWN, LIKE]
  polls:
    allow-anonymous-results: true
  ranking:
    age-penalty-per-day: 0.5
  features:
    voting-enabled-statuses: [NEW, UNDER_REVIEW, PLANNED]
    public-roadmap-visible: true
