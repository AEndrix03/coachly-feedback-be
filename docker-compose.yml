version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: coachly-feedback-postgres
    environment:
      POSTGRES_DB: coachly_feedback
      POSTGRES_USER: coachly
      POSTGRES_PASSWORD: coachly
    ports:
      - "5432:5432"
    volumes:
      - coachly-feedback-db:/var/lib/postgresql/data

volumes:
  coachly-feedback-db: